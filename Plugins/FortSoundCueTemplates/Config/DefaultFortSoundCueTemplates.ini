

[GlobalSettings]
SoundClassPath="Game/Sounds/FortSoundClassesAndModes"
AttenuationPath="Game/Sounds/Attenuation"
ConcurrencyPath="Game/Sounds/Concurrency_Rules"
SubmixPath="Game/Sounds/Submixes"
VolumeMultiplier=1.0f
PitchMultiplier=1.0f


[PickaxeSwing]
SoundCueDefaults=(SoundClass=Fort_WeaponMelee_PSM, Concurrency=Player_Melee_Weapon_Conc, Volume=0.3)
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_01.Fire_Axe_Swing_Distant_01"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_02.Fire_Axe_Swing_Distant_02"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_03.Fire_Axe_Swing_Distant_03"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_04.Fire_Axe_Swing_Distant_04"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_05.Fire_Axe_Swing_Distant_05"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_06.Fire_Axe_Swing_Distant_06"

[PickaxeReady]
SoundCueDefaults=(SoundClass=Fort_WeaponMelee_PSM, Volume=0.3)
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_01.Fire_Axe_Swing_Distant_01"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_02.Fire_Axe_Swing_Distant_02"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_03.Fire_Axe_Swing_Distant_03"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_04.Fire_Axe_Swing_Distant_04"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_05.Fire_Axe_Swing_Distant_05"
+DistantVariation="/Game/Athena/Sounds/Weapons/Fire_Axe_Swing_Distant_06.Fire_Axe_Swing_Distant_06"

[PickaxeImpactEnemy]
SoundCueDefaults=(SoundClass=Fort_Impact_Player_PSM, Attenuation=Fort_Weapon_Pickaxe_Player_Impact_Att)

[EmoteFoley]
SoundCueDefaults=(SoundClass=Fort_Music_Emote, Attenuation=Fort_Emotes_Athena_Att)
+SubmixSend=(Fortnite_AudioAnalysis_Music_Submix, 1.0)

[EmoteMusic]
SoundCueDefaults=(SoundClass=Fort_Music_Emote_1P_PSM, Concurrency=Athena_EmoteMusic_1P_Conc)
LicensedTrackAlternative="/Game/Sounds/Fort_Test_Sounds/5_seconds_silence.5_seconds_silence"
+SubmixSend=(Fortnite_AudioAnalysis_Music_Submix, 1.0)

[EmoteMusic3P]
SoundCueDefaults=(SoundClass=Fort_Music_Emote_3P, Attenuation=Fort_Emotes_Athena_Att,Concurrency=Athena_EmoteMusic_Conc)
LicensedTrackAlternative="/Game/Sounds/Fort_Test_Sounds/5_seconds_silence.5_seconds_silence"
+SubmixSend=(Fortnite_AudioAnalysis_Music_Submix, 1.0)

[MusicPack]
SoundCueDefaults=(SoundClass=Fort_Lobby_MusicPacks)
+SubmixSend=(Fortnite_AudioAnalysis_Music_Submix, 1.0)

[GliderThrustLoop]
SoundCueDefaults=(SoundClass=Fort_Gliders_Land, Attenuation=Fort_Player_Glider_Thrust_Athena_Att, Volume=0.9)
+ThrustDirection=(Forwards,(0,1,Normal),(0,1,Normal))
+ThrustDirection=(Sideways,(0,1,Normal),(0,1,Normal))
+ThrustDirection=(Backwards,(0,1,Normal),(0,1,Normal))
+ThrustDirection=(AnyDirection,(0,1,Normal),(0,1,Normal))

[GliderThrustStart]
SoundCueDefaults=(SoundClass=Fort_Gliders_Land, Attenuation=Fort_Player_Glider_Thrust_Athena_Att,Concurrency=Athena_Glider_Thrust_Conc)

[GliderOpen]
SoundCueDefaults=(SoundClass=Fort_Gliders_Land, Attenuation=Fort_Player_Glider_OpenClose_Athena_Att,Concurrency=Athena_GliderOpenClose_Conc)

[GliderClose]
SoundCueDefaults=(SoundClass=Fort_Gliders_Land, Attenuation=Fort_Player_Glider_OpenClose_Athena_Att,Concurrency=Athena_GliderOpenClose_Conc)

[PhysicsStateLoop]
SoundCueDefaults=(SoundClass=Fort_Physics_Looping, Attenuation="/Game/Sounds/Physics/Settings/Physics_StateLoop_Att.Physics_StateLoop_Att", Concurrency="/Game/Sounds/Physics/Settings/Physics_StateLoop_Conc.Physics_StateLoop_Conc")
+PhysicsState=(Rolling,(0,1,Normal),(0,1,Normal))
+PhysicsState=(Sliding,(0,1,Normal),(0,1,Normal))
+PhysicsState=(Flying,(0,1,Normal),(0,1,Normal))
+PhysicsState=(Floating,(0,1,Normal),(0,1,Normal))

[PhysicsImpact]
SoundCueDefaults=(SoundClass=Fort_Physics_Impact, Attenuation="/Game/Sounds/Physics/Settings/Physics_Impact_Att.Physics_Impact_Att", Concurrency="/Game/Sounds/Physics/Settings/Physics_Impact_Conc.Physics_Impact_Conc")
+Impact=(Light,(0,1,Normal),(0,1,Normal))
+Impact=(Medium,(0,1,Normal),(0,1,Normal))
+Impact=(Heavy,(0,1,Normal),(0,1,Normal))
